[project]
name = "jarvis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tal Elbert", email = "elberttal332@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pyside6-addons==6.12.0",
    "pyside6-essentials==6.12.0",
    "pyside6-webengine==6.12.0.140",
    "pyyaml>=6.0.3",
    "sympy>=1.14.0",
]

[project.scripts]
jarvis = "jarvis.cli:main"
jarvis-window = "jarvis.gui.app:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
